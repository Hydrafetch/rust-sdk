[package]
name = "hydrafetch"
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
description = "Official Rust client for the Hydrafetch web data API. Turn any URL into clean Markdown and structured data."
license = "MIT"
repository = "https://github.com/Hydrafetch/rust-sdk"
homepage = "https://hydrafetch.com"
documentation = "https://docs.rs/hydrafetch"
readme = "README.md"
keywords = ["scraping", "markdown", "llm", "rag", "crawler"]
categories = ["api-bindings", "web-programming::http-client"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
